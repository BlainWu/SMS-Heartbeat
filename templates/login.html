<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登录 - Heartbeat Monitor</title>
  <link href="/static/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-3">后台登录</h4>
      {% if err %}
        <div class="alert alert-danger">{{ err }}</div>
      {% endif %}
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">管理员密码</label>
          <input class="form-control" type="password" name="password" placeholder="输入密码" required />
        </div>
        <button class="btn btn-primary w-100" type="submit">登录</button>
      </form>
      <div class="text-muted small mt-3">
        默认用户名：admin（固定），密码在 main.py 的 ADMIN_PASSWORD 配置。
      </div>
    </div>
  </div>
</div>
</body>
</html>
